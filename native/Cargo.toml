# Enclave's Rust code: the deniable storage crate, and the bridge the
# app loads to keep its vault inside deniable containers.
[workspace]
resolver = "2"
members = ["deniable", "enclave-jni"]

[profile.release]
lto = true
codegen-units = 1
strip = true

# Debug info: file and line numbers for our code, none for dependencies,
# or the build folder grows by tens of gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
