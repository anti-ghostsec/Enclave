# Enclave's bridge from Kotlin to the deniable storage crate. The crate itself
# is shared with other projects and stays unchanged; everything Enclave-specific
# lives here or in the app.
[package]
name = "enclave-jni"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
deniable = { path = "../deniable" }
jni = "0.21"
