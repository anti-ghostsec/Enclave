name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Accepts the SDK licences so Gradle can fetch the platform it compiles against.
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the retired 'tools' package, which no longer installs.
          # The NDK links the native storage code for phones.
          packages: platform-tools ndk;29.0.14206865
      - name: Rust targets
        run: rustup target add aarch64-linux-android
      - name: Deniable storage crate tests
        working-directory: native
        run: cargo test --release
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build
        run: ./gradlew assembleDebug
