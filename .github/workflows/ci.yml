name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      # Accepts the SDK licences so Gradle can fetch the platform it compiles against.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default list includes the retired 'tools' package, which no longer installs.
          # The NDK links the native storage code for phones.
          packages: platform-tools ndk;29.0.14206865
      - name: Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Deniable storage crate tests
        working-directory: native
        run: cargo test --release --locked
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build
        run: ./gradlew assembleDebug
